[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sarthllm"
version = "0.0.1"
description = "GPT-2 style LLM built from scratch"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "tiktoken",
    "huggingface-hub>=0.24",
    "pyyaml>=6.0",
    "pyarrow>=15",
    "tqdm",
    "torch>=2.3",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "pre-commit"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
